short_bio: >-
  <p>
    I am currently a Ph.D. student in Energy and Nuclear Science and Technology at the Department of Energy,
    <a href="https://www.polimi.it/en/" target="_blank">Politecnico di Milano</a>, under the supervision of Prof. Enrico Zio.
    My doctoral research is conducted within the
    <a href="https://www.lasar.polimi.it" target="_blank">LASAR<sup>3</sup></a>
    (Laboratory of Analysis of Systems for the Assessment of Reliability, Risk and Resilience).
  </p>
  <p>
    My research interests and experience primarily focus on <strong>signal processing methods</strong> and
    <strong>deep learning models</strong> for the Prognostics and Health Management of industrial equipment,
    aiming to develop solutions for practical industrial applications, though there is still a long way to go.
    I am always happy to connect for academic discussions or research collaborations. Feel free to reach out via email!
  </p>

