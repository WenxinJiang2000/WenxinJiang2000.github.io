short_bio: >-
  <p>
    I am currently a Ph.D. student in Energy and Nuclear Science and Technology at the Department of Energy, <strong>Politecnico di Milano</strong>, under the supervision of Prof. Enrico Zio. My doctoral research is conducted within the <strong>LASAR³</strong> (Laboratory of Analysis of Systems for the Assessment of Reliability, Risk and Resilience).
  </p>
  <p>
    My research interests and experience primarily focus on signal processing methods and deep learning models for the Prognostics and Health Management of industrial equipments, aiming to develop solutions for practical industrial applications. I’m always happy to connect for any kind of academic discussions or research collaborations.
  </p>

